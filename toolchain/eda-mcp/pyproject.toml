[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-mcp"
version = "0.1.0"
description = "EDA 工具链 MCP 服务：Verdi NPI 设计查询 / FSDB 波形（FFR）/ WaveDrom / VCS / DC·PT"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vick" }]
keywords = ["eda", "mcp", "verdi", "fsdb", "vcs", "wavedrom"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
# 核心（波形 FFR 通路 + WaveDrom）**零第三方依赖**，便于 air-gap 服务器安装。
dependencies = []

[project.optional-dependencies]
# MCP 服务端（stdio / streamable-http）
server = ["mcp>=2.1,<3"]
# 开发期
dev = ["pytest>=7"]

[project.scripts]
eda-mcp = "eda_mcp.cli:main"
eda-mcp-server = "eda_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eda_mcp = ["native/*.cpp", "native/Makefile", "tcl/*.tcl"]
